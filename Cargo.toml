[package]
name = "bgrsc"
version = "0.1.0"
edition = "2024"

[dependencies]
ignore = { version = "0.4.33", default-features = false, features = [
    "simd-accel",
] }
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
clap = { version = "4.6.7", default-features = false, features = [
    "color",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
    "derive",
] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
termcolor = { version = "1.4.1", default-features = false }
thiserror = "2.0.21"
